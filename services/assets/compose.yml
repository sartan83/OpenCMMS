services:
  assets-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${ASSETS_POSTGRES_DB:-assets}
      POSTGRES_USER: ${ASSETS_POSTGRES_USER:-assets}
      POSTGRES_PASSWORD: ${ASSETS_POSTGRES_PASSWORD:-assets}
    volumes:
      - assets_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ASSETS_POSTGRES_USER:-assets} -d ${ASSETS_POSTGRES_DB:-assets}"]
      interval: 10s
      timeout: 5s
      retries: 5

  assets:
    build:
      context: ../..
      dockerfile: services/assets/Dockerfile
    env_file:
      - ../../.env
    environment:
      ASSETS_POSTGRES_HOST: assets-db
      JWKS_URL: http://identity:8000/.well-known/jwks.json
      EVENT_BUS_URL: amqp://guest:guest@rabbitmq:5672//
      SERVICE_NAME: assets
    command: ["sh", "-c", "python services/assets/manage.py migrate --noinput && exec gunicorn --chdir /app/services/assets assets_service.wsgi:application --bind 0.0.0.0:8000"]
    depends_on:
      assets-db:
        condition: service_healthy
      identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  assets_pgdata:
