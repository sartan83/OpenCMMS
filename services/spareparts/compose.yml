services:
  spareparts-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${SPAREPARTS_POSTGRES_DB:-spareparts}
      POSTGRES_USER: ${SPAREPARTS_POSTGRES_USER:-spareparts}
      POSTGRES_PASSWORD: ${SPAREPARTS_POSTGRES_PASSWORD:-spareparts}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - spareparts_pgdata:/var/lib/postgresql/data

  spareparts:
    build:
      context: .
      dockerfile: services/spareparts/Dockerfile
    env_file:
      - ../../.env
    environment:
      SPAREPARTS_POSTGRES_HOST: spareparts-db
      JWKS_URL: http://identity:8000/.well-known/jwks.json
      EVENT_BUS_URL: amqp://guest:guest@rabbitmq:5672//
      SERVICE_NAME: spareparts
    command: ["sh", "-c", "python services/spareparts/manage.py migrate --noinput && exec gunicorn --chdir /app/services/spareparts spareparts_service.wsgi:application --bind 0.0.0.0:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      spareparts-db:
        condition: service_healthy

volumes:
  spareparts_pgdata:
