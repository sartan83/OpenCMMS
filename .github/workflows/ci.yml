name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cmms
          POSTGRES_USER: cmms
          POSTGRES_PASSWORD: cmms
        options: >-
          --health-cmd "pg_isready -U cmms -d cmms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          DEBUG: "True"
          SECRET_KEY: ci-test-key
          POSTGRES_DB: cmms
          POSTGRES_USER: cmms
          POSTGRES_PASSWORD: cmms
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker build -t opencmms:ci .
